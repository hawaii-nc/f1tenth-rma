# Exported from checkpoints/archive/paper1_june_phase1_lidar36.pt (global_step=2000896)
environment:
  max_episode_steps: 1000
  control_frequency_hz: 50
  track: aut
  observation:
    include_lidar: true
    lidar_beams: 36
    include_imu: true
    normalize_obs: true
  randomization:
    apply_post_scale_noise: true
    noise_fraction: 0.2
    mid_episode_disturbance: true
    disturbance_timing:
    - 0.3
    - 0.9
    disturbance_magnitude: 0.3
  reward:
    use_wall_proximity: false
    weight_progress: 5.0
    weight_wall_proximity: 0.2
    weight_smoothness: 0.05
    weight_alive: 0.01
    weight_collision: 1.0
    max_progress_per_step: 0.5
    weight_speed_turn: 0.5
    speed_turn_steer_threshold: 0.15
    weight_close_wall: 0.1
    close_wall_threshold: 0.05
    max_action_diff: 0.4
    max_velocity_error: 2.0
    max_yaw_rate_error: 4.0
    max_track_error: 0.5
    min_speed: -0.1
    max_lateral_accel: 10.0
expert:
  type: pure_pursuit
  pure_pursuit:
    wheelbase: 0.33
    lookahead_distance_base: 0.3
    nominal_speed: 3.0
    max_steering: 0.4189
    min_speed: 1.5
    grip_aware: true
    grip_speed_scale:
      0.4: 0.6
      0.7: 0.85
      1.0: 1.0
    grip_steering_scale:
      0.4: 0.7
      0.7: 0.85
      1.0: 1.0
networks:
  policy:
    obs_dim: 5
    intrinsics_dim: 8
    action_dim: 2
    hidden_dim: 256
    num_layers: 3
    activation: relu
  intrinsics_encoder:
    env_params_dim: 7
    intrinsics_dim: 8
    hidden_dim: 128
    num_layers: 2
    activation: relu
  value:
    obs_dim: 5
    intrinsics_dim: 8
    hidden_dim: 256
    num_layers: 3
  adaptation:
    state_action_dim: 7
    history_window: 10
    intrinsics_dim: 8
    cnn_channels:
    - 32
    - 32
    - 8
    cnn_kernel_sizes:
    - 5
    - 5
    - 5
phase1_training:
  total_timesteps: 2000000
  debug_mode: false
  debug_timesteps: 100000
  num_envs: 1
  rollout_steps: 2048
  batch_size: 256
  num_epochs: 10
  ppo:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.2
    value_coeff: 0.5
    entropy_coeff: 0.01
    max_grad_norm: 0.5
  il:
    enabled: true
    il_weight_start: 1.0
    il_weight_decay: 0.0066
    il_weight_end: 0.01
    use_expert_actions: true
    rescue:
      plateau_window: 50
      plateau_threshold: 0.01
      rescue_il_weight: 0.3
      rescue_decay: 0.05
      max_rescues: 3
  checkpoint_interval: 10
  checkpoint_dir: checkpoints/phase1
  log_interval: 100
  eval_interval: 1000
phase2_training:
  enabled: true
  num_eval_episodes: 500
  num_envs: 1
  use_trained_policy: true
  learning_rate: 0.001
  batch_size: 64
  num_epochs: 100
  loss_type: mse
  buffer_size: 1000000
  window_size: 10
  checkpoint_interval: 10
  checkpoint_dir: checkpoints/phase2
  log_interval: 10
evaluation:
  delta_levels:
  - 0.0
  - 0.5
  - 1.0
  - 2.0
  - 4.0
  - 8.0
  episodes_per_delta: 100
  include_fixed_param_baseline: true
  include_oracle_baseline: true
  plot_dir: eval_results
  metrics:
  - success_rate
  - position_error
  - velocity_tracking_error
  - avg_episode_length
logging:
  log_dir: logs
  save_video: false
  video_interval: 1000
  tracked_metrics:
  - episode_reward
  - episode_length
  - il_loss
  - rl_loss
  - policy_entropy
  - value_loss
  - physics_param_grip_factor
  - physics_param_mass_scale
